  # ── Alarma: ejecuciones fallidas de Step Functions > 3 en 10 minutos ──
  AlarmStepFunctionsFailed:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "fiscal-pipeline-executions-failed-${Environment}"
      AlarmDescription: "Más de 3 ejecuciones del pipeline fallaron en los últimos 10 minutos"
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref FiscalPipelineStateMachine
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 600
      Statistic: Sum
      Threshold: 3
      TreatMissingData: notBreaching

  # ─────────────────────────────────────────────
  # TRIGGER: S3 Fact_input → EventBridge → Step Functions
  # ─────────────────────────────────────────────

  # ── Rol IAM para que EventBridge invoque Step Functions ──
  EventBridgeToStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "fiscal-pipeline-eb-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeStartStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref FiscalPipelineStateMachine

  # ── Regla EventBridge: s3:ObjectCreated en Fact_input → Step Functions ──
  # S3 ya tiene EventBridgeEnabled: true en su configuración (definido arriba).
  # Esta regla filtra solo eventos de creación de objetos en el bucket Fact_input
  # y construye el payload inicial del pipeline extrayendo processing_id y s3_key.
  S3ToStepFunctionsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "fact-input-to-pipeline-${Environment}"
      Description: Dispara el pipeline fiscal cuando se sube un archivo a Fact_input
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref FactInputBucket
      Targets:
        - Id: FiscalPipelineTarget
          Arn: !Ref FiscalPipelineStateMachine
          RoleArn: !GetAtt EventBridgeToStepFunctionsRole.Arn
          # Transformar el evento S3 al payload inicial del pipeline:
          # { "processing_id": "<prefijo de la clave>", "s3_key": "<clave completa>" }
          # La clave S3 tiene formato: {processing_id}/{filename}
          # Extraemos el processing_id tomando todo lo que está antes del primer "/"
          InputTransformer:
            InputPathsMap:
              s3_key: "$.detail.object.key"
            InputTemplate: |
              {
                "processing_id": "<s3_key>",
                "s3_key": "<s3_key>",
                "document_type": null,
                "quality_score": null,
                "extracted_data": null,
                "error": null
              }

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  FactInputBucketName:
    Description: Nombre del bucket S3 de entrada
    Value: !Ref FactInputBucket
    Export:
      Name: !Sub "${AWS::StackName}-FactInputBucket"

  FactOutputBucketName:
    Description: Nombre del bucket S3 de salida
    Value: !Ref FactOutputBucket
    Export:
      Name: !Sub "${AWS::StackName}-FactOutputBucket"

  PipelineExecutionsTableName:
    Description: Nombre de la tabla DynamoDB de ejecuciones
    Value: !Ref PipelineExecutionsTable
    Export:
      Name: !Sub "${AWS::StackName}-PipelineExecutionsTable"

  TxCounterTableName:
    Description: Nombre de la tabla DynamoDB de contadores
    Value: !Ref TxCounterTable
    Export:
      Name: !Sub "${AWS::StackName}-TxCounterTable"

  PresignLambdaRoleArn:
    Description: ARN del rol IAM para la Lambda presign
    Value: !GetAtt PresignLambdaRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PresignLambdaRoleArn"

  DocClasifLambdaRoleArn:
    Description: ARN del rol IAM para la Lambda doc-clasif
    Value: !GetAtt DocClasifLambdaRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocClasifLambdaRoleArn"

  DocEvalLambdaRoleArn:
    Description: ARN del rol IAM para la Lambda doc-eval
    Value: !GetAtt DocEvalLambdaRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocEvalLambdaRoleArn"

  DataExtractLambdaRoleArn:
    Description: ARN del rol IAM para la Lambda data-extract
    Value: !GetAtt DataExtractLambdaRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DataExtractLambdaRoleArn"

  JsonGenLambdaRoleArn:
    Description: ARN del rol IAM para la Lambda json-gen
    Value: !GetAtt JsonGenLambdaRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-JsonGenLambdaRoleArn"

  PresignApiUrl:
    Description: URL del endpoint POST /presign en API Gateway
    Value: !Sub "https://${PresignApi}.execute-api.${AWS::Region}.amazonaws.com/presign"
    Export:
      Name: !Sub "${AWS::StackName}-PresignApiUrl"

  StatusApiUrl:
    Description: URL base del endpoint GET /status/{processingId} en API Gateway
    Value: !Sub "https://${PresignApi}.execute-api.${AWS::Region}.amazonaws.com/status"
    Export:
      Name: !Sub "${AWS::StackName}-StatusApiUrl"

  WebAppUrl:
    Description: URL pública de la Web_App servida por CloudFront
    Value: !Sub "https://${WebAppDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-WebAppUrl"

  DocClasifFunctionArn:
    Description: ARN de la Lambda doc-clasif
    Value: !GetAtt DocClasifFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocClasifFunctionArn"

  DocEvalFunctionArn:
    Description: ARN de la Lambda doc-eval
    Value: !GetAtt DocEvalFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocEvalFunctionArn"

  DataExtractFunctionArn:
    Description: ARN de la Lambda data-extract
    Value: !GetAtt DataExtractFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DataExtractFunctionArn"

  JsonGenFunctionArn:
    Description: ARN de la Lambda json-gen
    Value: !GetAtt JsonGenFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-JsonGenFunctionArn"

  FiscalPipelineStateMachineArn:
    Description: ARN de la máquina de estados Step Functions del pipeline fiscal
    Value: !Ref FiscalPipelineStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-FiscalPipelineStateMachineArn"

  EventBridgeRuleArn:
    Description: ARN de la regla EventBridge que dispara el pipeline al subir un archivo
    Value: !GetAtt S3ToStepFunctionsRule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRuleArn"

  DashboardUrl:
    Description: URL del dashboard de CloudWatch del pipeline fiscal
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=fiscal-pipeline-${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-DashboardUrl"