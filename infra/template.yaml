    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "fiscal-pipeline-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": {
                "markdown": "# Pipeline Fiscal — Entorno: ${Environment}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "Invocaciones Lambda (por función)",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "doc-clasif-${Environment}", {"label": "doc-clasif"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "doc-eval-${Environment}", {"label": "doc-eval"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "data-extract-${Environment}", {"label": "data-extract"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "json-gen-${Environment}", {"label": "json-gen"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "Errores Lambda (por función)",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "doc-clasif-${Environment}", {"label": "doc-clasif", "color": "#d62728"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "doc-eval-${Environment}", {"label": "doc-eval", "color": "#ff7f0e"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "data-extract-${Environment}", {"label": "data-extract", "color": "#9467bd"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "json-gen-${Environment}", {"label": "json-gen", "color": "#8c564b"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "Duración Lambda P95 (ms)",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "p95",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "doc-clasif-${Environment}", {"label": "doc-clasif"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "doc-eval-${Environment}", {"label": "doc-eval"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "data-extract-${Environment}", {"label": "data-extract"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "json-gen-${Environment}", {"label": "json-gen"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "Ejecuciones Step Functions",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${FiscalPipelineStateMachine}", {"label": "Iniciadas"}],
                  ["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${FiscalPipelineStateMachine}", {"label": "Exitosas", "color": "#2ca02c"}],
                  ["AWS/States", "ExecutionsFailed", "StateMachineArn", "${FiscalPipelineStateMachine}", {"label": "Fallidas", "color": "#d62728"}]
