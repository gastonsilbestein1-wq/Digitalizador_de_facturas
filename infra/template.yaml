                  ["AWS/Lambda", "Throttles", "FunctionName", "doc-eval-${Environment}", {"label": "doc-eval"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "data-extract-${Environment}", {"label": "data-extract"}],
