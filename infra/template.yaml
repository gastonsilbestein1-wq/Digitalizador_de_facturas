              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "data-extract-${Environment}"
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "data-extract-${Environment}"
            Period: 300
