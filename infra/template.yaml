  # ── Alarma: tasa de error Lambda > 5% en 5 minutos ──
  # Se crea una alarma por cada Lambda del pipeline.
  # Usa métrica de expresión: Errors / Invocations > 0.05

  AlarmDocClasifErrorRate:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "doc-clasif-error-rate-${Environment}"
      AlarmDescription: "Tasa de error de doc-clasif supera el 5% en 5 minutos"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 5
      TreatMissingData: notBreaching
      Metrics:
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "doc-clasif-${Environment}"
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "doc-clasif-${Environment}"
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: error_rate
          Expression: "(errors / invocations) * 100"
          Label: "Tasa de error doc-clasif (%)"
          ReturnData: true

  AlarmDocEvalErrorRate:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "doc-eval-error-rate-${Environment}"
      AlarmDescription: "Tasa de error de doc-eval supera el 5% en 5 minutos"
