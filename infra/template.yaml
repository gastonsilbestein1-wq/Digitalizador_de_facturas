AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestructura base para el procesador de documentos fiscales argentinos.
  Incluye buckets S3, tablas DynamoDB, roles IAM y grupos de logs CloudWatch.

# ─────────────────────────────────────────────
# PARÁMETROS
# ─────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Entorno de despliegue

# ─────────────────────────────────────────────
# RECURSOS
# ─────────────────────────────────────────────
Resources:

  # ── S3: Bucket de entrada (Fact_input) ──────
  FactInputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fact-input-${Environment}-${AWS::AccountId}"
      # Cifrado SSE-S3
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Regla de ciclo de vida: expirar objetos a los 7 días
      LifecycleConfiguration:
        Rules:
          - Id: ExpirarDocumentosEntrada
            Status: Enabled
            ExpirationInDays: 7
      # Notificaciones a EventBridge habilitadas
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      # Bloqueo de acceso público
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── S3: Bucket de salida (Fact_output) ──────
  FactOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fact-output-${Environment}-${AWS::AccountId}"
      # Cifrado SSE-S3
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versionado habilitado (los JSONs son el output permanente del sistema)
      VersioningConfiguration:
        Status: Enabled
      # Bloqueo de acceso público
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── DynamoDB: Estado de ejecuciones del pipeline ──
  PipelineExecutionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pipeline-executions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: processing_id
          AttributeType: S
      KeySchema:
        - AttributeName: processing_id
          KeyType: HASH

  # ── DynamoDB: Contador de transacciones por día ──
  TxCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tx-counter
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH

  # ─────────────────────────────────────────────
  # ROLES IAM (principio de mínimo privilegio)
  # ─────────────────────────────────────────────

  # ── Rol para Lambda presign ──────────────────
  PresignLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "presign-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PresignLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permiso para generar URL pre-firmada (PutObject en Fact_input)
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${FactInputBucket.Arn}/*"
              # Permiso para leer JSONs del bucket de salida (presigned URL GET para status)
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${FactOutputBucket.Arn}/*"
              # Permiso para leer y actualizar el contador de transacciones
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt TxCounterTable.Arn
              # Permiso para consultar el estado de ejecuciones (endpoint /status)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt PipelineExecutionsTable.Arn
              # Permisos básicos de CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/presign:*"

  # ── Rol para Lambda doc-clasif ───────────────
  DocClasifLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "doc-clasif-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DocClasifLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permiso para leer documentos del bucket de entrada
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${FactInputBucket.Arn}/*"
              # Permiso para invocar modelos de Bedrock
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              # Permisos básicos de CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/doc-clasif:*"

  # ── Rol para Lambda doc-eval ─────────────────
  DocEvalLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "doc-eval-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DocEvalLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permiso para leer documentos del bucket de entrada
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${FactInputBucket.Arn}/*"
              # Permiso para invocar modelos de Bedrock
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              # Permisos básicos de CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/doc-eval:*"

  # ── Rol para Lambda data-extract ─────────────
  DataExtractLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "data-extract-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DataExtractLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permiso para leer documentos del bucket de entrada
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${FactInputBucket.Arn}/*"
              # Permiso para invocar modelos de Bedrock
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              # Permisos básicos de CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/data-extract:*"

  # ── Rol para Lambda json-gen ─────────────────
  JsonGenLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "json-gen-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JsonGenLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permiso para escribir JSONs en el bucket de salida
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${FactOutputBucket.Arn}/*"
              # Permiso para escribir y actualizar el estado de ejecuciones
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PipelineExecutionsTable.Arn
              # Permisos básicos de CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/json-gen:*"

  # ─────────────────────────────────────────────
  # GRUPOS DE LOGS CLOUDWATCH (retención 30 días)
  # ─────────────────────────────────────────────

  LogGroupPresign:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/presign
      RetentionInDays: 30

  LogGroupDocClasif:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/doc-clasif
      RetentionInDays: 30

  LogGroupDocEval:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/doc-eval
      RetentionInDays: 30

  LogGroupDataExtract:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/data-extract
      RetentionInDays: 30

  LogGroupJsonGen:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/json-gen
      RetentionInDays: 30

  LogGroupStepFunctions:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/states/fiscal-pipeline
      RetentionInDays: 30

  # ─────────────────────────────────────────────
  # LAMBDA: presign
  # ─────────────────────────────────────────────

  # ── Función Lambda presign ───────────────────
  PresignFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupPresign
    Properties:
      FunctionName: !Sub "presign-${Environment}"
      Description: Genera URLs pre-firmadas para subida a S3 y asigna el processing_id
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt PresignLambdaRole.Arn
      Timeout: 30
      # Variables de entorno requeridas por la Lambda
      Environment:
        Variables:
          FACT_INPUT_BUCKET: !Ref FactInputBucket
          TX_COUNTER_TABLE: !Ref TxCounterTable
          PIPELINE_EXECUTIONS_TABLE: !Ref PipelineExecutionsTable
          FACT_OUTPUT_BUCKET: !Ref FactOutputBucket
      # Código stub mínimo; el código real se despliega por separado (ZIP/SAM)
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "stub"}
      # Apuntar al log group creado explícitamente con retención de 30 días
      LoggingConfig:
        LogGroup: /aws/lambda/presign

  # ─────────────────────────────────────────────
  # API GATEWAY HTTP API
  # ─────────────────────────────────────────────

  # ── HTTP API con CORS habilitado ─────────────
  PresignApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "presign-api-${Environment}"
      Description: API HTTP para el endpoint de pre-firma de documentos fiscales
      ProtocolType: HTTP
      # Configuración CORS para permitir llamadas desde la Web_App
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # ── Integración Lambda con la función presign ─
  PresignIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PresignApi
      Description: Integración proxy con la Lambda presign
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PresignFunction.Arn
      PayloadFormatVersion: "2.0"

  # ── Ruta POST /presign ────────────────────────
  PresignRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PresignApi
      RouteKey: "POST /presign"
      Target: !Sub "integrations/${PresignIntegration}"

  # ── Ruta GET /status/{processingId} ──────────
  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PresignApi
      RouteKey: "GET /status/{processingId}"
      Target: !Sub "integrations/${PresignIntegration}"

  # ── Stage de despliegue con auto-deploy ───────
  PresignApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PresignApi
      StageName: "$default"
      Description: Stage de despliegue automático para la API presign
      AutoDeploy: true

  # ── Permiso para que API Gateway invoque la Lambda ──
  PresignLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PresignFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PresignApi}/*/*/presign"

  # ── Permiso para que API Gateway invoque la Lambda desde /status ──
  StatusLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PresignFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PresignApi}/*/*/status/*"

  # ─────────────────────────────────────────────
  # LAMBDAS DEL PIPELINE
  # ─────────────────────────────────────────────

  # ── Lambda doc-clasif ────────────────────────
  DocClasifFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupDocClasif
    Properties:
      FunctionName: !Sub "doc-clasif-${Environment}"
      Description: Clasifica el tipo de documento fiscal usando Bedrock (Claude)
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt DocClasifLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          FACT_INPUT_BUCKET: !Ref FactInputBucket
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      Code:
        ZipFile: |
          def handler(event, context):
              return {"error": "stub"}
      LoggingConfig:
        LogGroup: /aws/lambda/doc-clasif

  # ── Lambda doc-eval ──────────────────────────
  DocEvalFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupDocEval
    Properties:
      FunctionName: !Sub "doc-eval-${Environment}"
      Description: Evalúa la calidad del documento fiscal usando Bedrock (Claude)
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt DocEvalLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          FACT_INPUT_BUCKET: !Ref FactInputBucket
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      Code:
        ZipFile: |
          def handler(event, context):
              return {"error": "stub"}
      LoggingConfig:
        LogGroup: /aws/lambda/doc-eval

  # ── Lambda data-extract ──────────────────────
  DataExtractFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupDataExtract
    Properties:
      FunctionName: !Sub "data-extract-${Environment}"
      Description: Extrae los campos fiscales del documento usando Bedrock (Claude)
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt DataExtractLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          FACT_INPUT_BUCKET: !Ref FactInputBucket
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      Code:
        ZipFile: |
          def handler(event, context):
              return {"error": "stub"}
      LoggingConfig:
        LogGroup: /aws/lambda/data-extract

  # ── Lambda json-gen ──────────────────────────
  JsonGenFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupJsonGen
    Properties:
      FunctionName: !Sub "json-gen-${Environment}"
      Description: Ensambla el JSON_Fiscal y lo persiste en Fact_output
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt JsonGenLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          FACT_OUTPUT_BUCKET: !Ref FactOutputBucket
          PIPELINE_EXECUTIONS_TABLE: !Ref PipelineExecutionsTable
      Code:
        ZipFile: |
          def handler(event, context):
              return {"error": "stub"}
      LoggingConfig:
        LogGroup: /aws/lambda/json-gen

  # ─────────────────────────────────────────────
  # WEB APP: S3 + CloudFront (OAC)
  # ─────────────────────────────────────────────

  # ── Bucket S3 para la Web_App estática ───────
  WebAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fact-webapp-${Environment}-${AWS::AccountId}"
      # Cifrado SSE-S3
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Acceso público bloqueado completamente; el acceso se gestiona vía CloudFront OAC
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Sin website hosting: CloudFront sirve los archivos directamente desde S3

  # ── Origin Access Control para CloudFront ────
  # Permite que CloudFront acceda al bucket S3 sin exponer el bucket públicamente
  WebAppOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "fact-webapp-oac-${Environment}"
        Description: OAC para la Web_App del procesador de documentos fiscales
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Distribución CloudFront ───────────────────
  WebAppDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Distribución CloudFront para la Web_App fiscal (${Environment})"
        Enabled: true
        HttpVersion: http2
        # Solo US y Europa para reducir costos (PriceClass_100)
        PriceClass: PriceClass_100
        # Archivo raíz de la SPA
        DefaultRootObject: index.html
        Origins:
          - Id: WebAppS3Origin
            DomainName: !GetAtt WebAppBucket.RegionalDomainName
            # Usar OAC en lugar del obsoleto OAI
            OriginAccessControlId: !GetAtt WebAppOAC.Id
            S3OriginConfig:
              # Vacío porque el acceso se controla con OAC, no con OAI
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: WebAppS3Origin
          # Redirigir HTTP a HTTPS
          ViewerProtocolPolicy: redirect-to-https
          # Política de caché optimizada para contenido estático (CachingOptimized)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          CachedMethods:  [GET, HEAD]
          Compress: true
        # Manejo de errores para SPA: redirigir 404 a index.html con código 200
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ── Bucket Policy: permitir acceso solo desde CloudFront OAC ──
  WebAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACGetObject
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebAppBucket.Arn}/*"
            Condition:
              StringEquals:
                # Restringir al ARN exacto de esta distribución CloudFront
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebAppDistribution}"

  # ─────────────────────────────────────────────
  # STEP FUNCTIONS — Orquestador del pipeline
  # ─────────────────────────────────────────────

  # ── Rol IAM para Step Functions ──────────────
  # Permite invocar las 4 Lambdas del pipeline y escribir logs en CloudWatch
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "fiscal-pipeline-sfn-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Invocar las 4 Lambdas del pipeline
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt DocClasifFunction.Arn
                  - !GetAtt DocEvalFunction.Arn
                  - !GetAtt DataExtractFunction.Arn
                  - !GetAtt JsonGenFunction.Arn
              # Escribir y actualizar ítems en DynamoDB pipeline-executions
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PipelineExecutionsTable.Arn
              # Escribir logs de ejecución en CloudWatch
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  # ── Máquina de estados del pipeline fiscal ───
  FiscalPipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "fiscal-pipeline-${Environment}"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsRole.Arn
      # Logging de todas las ejecuciones en CloudWatch
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt LogGroupStepFunctions.Arn
      # ── Definición ASL de la máquina de estados ──
      Definition:
        Comment: "Pipeline de procesamiento de documentos fiscales argentinos"
        StartAt: RegistrarInicio

        States:

          # ── Paso 0: Registrar inicio en DynamoDB ──
          RegistrarInicio:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName: !Ref PipelineExecutionsTable
              Item:
                processing_id:
                  S.$: "$.processing_id"
                s3_key:
                  S.$: "$.s3_key"
                status:
                  S: "RUNNING"
                current_step:
                  S: "DOC_CLASIF"
                created_at:
                  S.$: "$$.Execution.StartTime"
                updated_at:
                  S.$: "$$.Execution.StartTime"
            ResultPath: "null"
            Next: DocClasif

          # ── Paso 1: Clasificación del documento ──
          DocClasif:
            Type: Task
            Resource: !GetAtt DocClasifFunction.Arn
            ResultPath: "$"
            Next: VerificarErrorClasif
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.lambda_error"
                Next: RegistrarError

          VerificarErrorClasif:
            Type: Choice
            Choices:
              - Variable: "$.error"
                IsNull: false
                Next: RegistrarError
            Default: ActualizarPasoDocEval_Pre

          # Actualizar current_step antes de doc-eval
          ActualizarPasoDocEval_Pre:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref PipelineExecutionsTable
              Key:
                processing_id:
                  S.$: "$.processing_id"
              UpdateExpression: "SET current_step = :step, updated_at = :ts"
              ExpressionAttributeValues:
                ":step":
                  S: "DOC_EVAL"
                ":ts":
                  S.$: "$$.State.EnteredTime"
            ResultPath: "null"
            Next: DocEval

          # ── Paso 2: Evaluación de calidad ────────
          DocEval:
            Type: Task
            Resource: !GetAtt DocEvalFunction.Arn
            ResultPath: "$"
            Next: VerificarErrorEval
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.lambda_error"
                Next: RegistrarError

          VerificarErrorEval:
            Type: Choice
            Choices:
              - Variable: "$.error"
                IsNull: false
                Next: RegistrarError
            Default: ActualizarPasoDataExtract_Pre

          # Actualizar current_step antes de data-extract
          ActualizarPasoDataExtract_Pre:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref PipelineExecutionsTable
              Key:
                processing_id:
                  S.$: "$.processing_id"
              UpdateExpression: "SET current_step = :step, updated_at = :ts"
              ExpressionAttributeValues:
                ":step":
                  S: "DATA_EXTRACT"
                ":ts":
                  S.$: "$$.State.EnteredTime"
            ResultPath: "null"
            Next: DataExtract

          # ── Paso 3: Extracción de datos ──────────
          DataExtract:
            Type: Task
            Resource: !GetAtt DataExtractFunction.Arn
            ResultPath: "$"
            Next: VerificarErrorExtract
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.lambda_error"
                Next: RegistrarError

          VerificarErrorExtract:
            Type: Choice
            Choices:
              - Variable: "$.error"
                IsNull: false
                Next: RegistrarError
            Default: ActualizarPasoJsonGen_Pre

          # Actualizar current_step antes de json-gen
          ActualizarPasoJsonGen_Pre:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref PipelineExecutionsTable
              Key:
                processing_id:
                  S.$: "$.processing_id"
              UpdateExpression: "SET current_step = :step, updated_at = :ts"
              ExpressionAttributeValues:
                ":step":
                  S: "JSON_GEN"
                ":ts":
                  S.$: "$$.State.EnteredTime"
            ResultPath: "null"
            Next: JsonGen

          # ── Paso 4: Generación del JSON fiscal ───
          JsonGen:
            Type: Task
            Resource: !GetAtt JsonGenFunction.Arn
            ResultPath: "$"
            Next: VerificarErrorJsonGen
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.lambda_error"
                Next: RegistrarError

          VerificarErrorJsonGen:
            Type: Choice
            Choices:
              - Variable: "$.error"
                IsNull: false
                Next: RegistrarError
            Default: PipelineCompletado

          # ── Estado final exitoso ─────────────────
          PipelineCompletado:
            Type: Succeed

          # ── Estado de error: registrar en DynamoDB ──
          # json-gen ya actualiza DynamoDB en caso de éxito;
          # este estado cubre rechazos (doc-clasif, doc-eval) y errores técnicos.
          # El error_code distingue el tipo: DOCUMENT_NOT_FISCAL / QUALITY_BELOW_THRESHOLD = rechazo,
          # CLASSIFICATION_ERROR / EVALUATION_ERROR / EXTRACTION_ERROR / JSON_WRITE_ERROR = fallo técnico.
          RegistrarError:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref PipelineExecutionsTable
              Key:
                processing_id:
                  S.$: "$.processing_id"
              UpdateExpression: "SET #s = :status, error_code = :ec, updated_at = :ts"
              ExpressionAttributeNames:
                "#s": "status"
              ExpressionAttributeValues:
                ":status":
                  S: "FAILED"
                ":ec":
                  S.$: "States.Format('{}', $.error)"
                ":ts":
                  S.$: "$$.State.EnteredTime"
            ResultPath: "null"
            Next: PipelineFallido

          PipelineFallido:
            Type: Fail
            Error: "PipelineError"
            Cause: "El pipeline se detuvo por un error o rechazo del documento"

  # ─────────────────────────────────────────────
  # OBSERVABILIDAD: CloudWatch Dashboard y Alarmas
  # ─────────────────────────────────────────────

  # ── Dashboard con métricas clave del pipeline ──
